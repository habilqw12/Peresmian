<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peresmian Fasilitas Kamar Mandi TK Hang Tuah 2 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0a192f', 900: '#050c1a', 950: '#020611' },
                        cyan: { glow: '#00f0ff' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #020611; color: #f3f4f6; overflow: hidden; user-select: none; }
        .bg-cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
        }
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px; pointer-events: none; z-index: 40; opacity: 0.2;
        }
        .video-glow { box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), 0 0 10px rgba(245, 158, 11, 0.15); }
        video::-webkit-media-controls { display: none !important; }
        video { pointer-events: none; }
    </style>
</head>
<body class="bg-navy-950 font-sans h-screen w-screen relative flex flex-col justify-between bg-cyber-grid antialiased overflow-hidden">

    <div class="scanline"></div>

    <!-- HEADER -->
    <header class="relative z-20 w-full px-4 sm:px-6 py-3 flex justify-between items-center border-b border-cyan-500/20 bg-navy-900/80 backdrop-blur-md shrink-0">
        <div class="flex items-center space-x-3">
            <div class="relative flex h-3 w-3 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
            </div>
            <h1 class="font-bold text-xs sm:text-sm md:text-base text-white tracking-wider">TK HANG TUAH 2</h1>
        </div>
        <div class="flex items-center space-x-3 text-right">
            <h1 class="font-bold text-xs sm:text-sm md:text-base text-white tracking-wider">ACARA PERESMIAN KAMAR MANDI</h1>
            <div class="relative flex h-3 w-3 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-gold-500"></span>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA VIDEO -->
    <main class="relative z-20 flex-grow w-full h-full flex items-center justify-center p-1 sm:p-3 overflow-hidden">
        <div id="videoContainer" onclick="togglePlayVideo()" class="relative w-full h-full max-w-full max-h-full rounded-xl overflow-hidden border border-cyan-400/50 bg-black cursor-pointer shadow-2xl transition-all duration-300 video-glow flex items-center justify-center">
            
            <video 
                id="ceremonyVideo" 
                class="w-full h-full object-contain block"
                playsinline 
                preload="metadata">
                <source src="https://github.com/habilqw12/Vidio/raw/refs/heads/main/VID-20261023-WA0006.mp4#t=0.1" type="video/mp4">
            </video>

            <!-- OVERLAY INTERAKTIF (POSISI DIBUAT LEBIH KE BAWAH DENGAN JUSTIFY-CENTER) -->
            <div id="touchIndicator" class="absolute inset-0 pointer-events-none transition-opacity duration-500 z-20 flex flex-col justify-center items-center gap-8 sm:gap-10 px-6 sm:px-24 pt-16">
                
                <!-- Teks Instruksi Atas (Gaya Sci-Fi HUD) -->
                <div class="bg-navy-900/95 border-2 border-cyan-400 px-8 py-2.5 rounded-lg shadow-[0_0_20px_rgba(0,240,255,0.5)] animate-pulse">
                    <span class="font-tech text-xs sm:text-sm md:text-base text-cyan-300 tracking-[0.3em] uppercase font-bold">
                        RAISE YOUR HAND / TOUCH TO START
                    </span>
                </div>

                <!-- Kontainer Dua Telapak Tangan (Diatur Presisi Lebih ke Bawah) -->
                <div class="w-full max-w-5xl flex justify-between items-center px-4 sm:px-8">
                    
                    <!-- Telapak Tangan Kiri -->
                    <div class="relative p-4 rounded-2xl bg-navy-900/90 border-2 border-cyan-400 shadow-[0_0_30px_rgba(0,240,255,0.5)] animate-pulse flex items-center justify-center w-36 h-48 sm:w-44 sm:h-56">
                        <div class="absolute inset-0 bg-cyan-500/10 rounded-xl"></div>
                        <i data-lucide="hand" class="w-24 h-24 sm:w-28 sm:h-28 text-cyan-300 drop-shadow-[0_0_15px_#00f0ff]"></i>
                    </div>

                    <!-- Telapak Tangan Kanan -->
                    <div class="relative p-4 rounded-2xl bg-navy-900/90 border-2 border-cyan-400 shadow-[0_0_30px_rgba(0,240,255,0.5)] animate-pulse flex items-center justify-center w-36 h-48 sm:w-44 sm:h-56">
                        <div class="absolute inset-0 bg-cyan-500/10 rounded-xl"></div>
                        <i data-lucide="hand" class="w-24 h-24 sm:w-28 sm:h-28 text-cyan-300 drop-shadow-[0_0_15px_#00f0ff]"></i>
                    </div>

                </div>

            </div>

            <!-- OVERLAY PESAN TERIMA KASIH & PERESMIAN (MUNCUL PAS VIDEO RAMPUNG DAN DIKUNCI) -->
            <div id="thankYouOverlay" class="absolute inset-0 bg-navy-950/95 backdrop-blur-md transition-opacity duration-700 z-30 flex flex-col justify-center items-center gap-6 px-6 opacity-0 pointer-events-none">
                <div class="bg-navy-900/95 border-2 border-gold-400 max-w-2xl px-8 py-8 rounded-2xl shadow-[0_0_40px_rgba(245,158,11,0.5)] text-center animate-pulse">
                    <h2 class="font-tech text-2xl sm:text-4xl md:text-5xl text-gold-400 tracking-[0.2em] uppercase font-black mb-4">
                        TERIMA KASIH
                    </h2>
                    <p class="font-tech text-xs sm:text-sm md:text-base text-cyan-200 tracking-wider leading-relaxed uppercase">
                        Selamat atas peresmian toilet bersih guru & murid TK Hang Tuah 2 Surabaya
                    </p>
                </div>
            </div>

            <!-- TOMBOL IKON FULLSCREEN KECIL DI POJOK KANAN BAWAH -->
            <button onclick="event.stopPropagation(); toggleFullscreen();" class="absolute bottom-4 right-4 z-40 p-2.5 rounded-lg bg-navy-900/80 border border-cyan-500/40 text-cyan-400 hover:bg-cyan-500 hover:text-navy-950 transition-all shadow-lg backdrop-blur-sm" title="Layar Penuh">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-20 w-full px-4 py-2 border-t border-cyan-500/20 bg-navy-950/95 text-center text-[10px] sm:text-xs text-gray-400 font-tech shrink-0">
        <p>&copy; 2026 SMK KAL 1 SURABAYA</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        lucide.createIcons();

        const video = document.getElementById('ceremonyVideo');
        const touchIndicator = document.getElementById('touchIndicator');
        const thankYouOverlay = document.getElementById('thankYouOverlay');
        let hasPlayed = false; // Penanda lek video wis tau diputer

        function togglePlayVideo() {
            // Lek video wis tau diputer, ora bakal iso diputer maneh (kudu refresh)
            if (hasPlayed) return;

            if (video.paused) {
                hasPlayed = true; // Kunci supaya ora iso diputer ulang

                // Hilangkan indikator tangan secara halus saat disentuh
                touchIndicator.style.opacity = '0';
                setTimeout(() => {
                    touchIndicator.style.display = 'none';
                }, 500);

                video.play().catch(err => {
                    console.error("Gagal memutar video:", err);
                });
            }
        }

        // Pas video rampung, tampilkan ucapan terima kasih secara permanen
        video.addEventListener('ended', () => {
            thankYouOverlay.style.display = 'flex';
            setTimeout(() => {
                thankYouOverlay.style.opacity = '1';
            }, 50);
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Gagal masuk mode layar penuh:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('dblclick', () => {
            toggleFullscreen();
        });
    </script>
</body>
        </html>
